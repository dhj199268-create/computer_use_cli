[project]
name = "computer-use-cli"
version = "0.1.0"
description = "A computer control CLI tool based on pyautogui"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
dependencies = [
    "pyautogui>=0.9.54",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
computer-use = "computer_use.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "file"
path = "src/computer_use/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]
